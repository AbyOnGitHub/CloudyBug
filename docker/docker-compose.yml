version: '3.8'

services:
  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack-prowler
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres-checkpointer
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=security_assistant
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: prowler-fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/security_assistant
      - USE_MOCK_FALLBACK=true
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - "../backend:/app/backend"
      - "../frontend:/app/frontend"
      - "../scan_output:/app/scan_output"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: prowler-localstack-net
